# Publishes the companion web app (companion/) to GitHub Pages.
# Deploys on release tags only, so the hosted companion matches the latest
# firmware release (STATE/METERS formats ship together; see AGENTS.md).
# Enable once the repo is public: Settings > Pages > Source: GitHub Actions.
name: Companion on GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Companion tests
        run: node --test companion/tests/*.test.mjs
      - name: Stage site (no tests or package.json)
        run: |
          mkdir _site
          cp -R companion/index.html companion/css companion/js companion/data companion/LICENSES _site/
          cp LICENSE _site/LICENSE
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
