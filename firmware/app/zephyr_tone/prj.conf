# SP-1 FX tone bring-up image: watchdog + LEDs + FN-hold power-off (as
# zephyr_min) plus I2C codecs, I2S (slave) test tone and a USB CDC ACM
# status console. See docs/BRINGUP_TONE.md.

CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_FPU=y

# I2S TX queue depth: 4 queued blocks (Zephyr default, same as Tape Looper).
# With 64-frame blocks (1.33 ms each) that is ~5.3 ms queued + 2 in DMA.
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=4

# No printk/console: the status line goes through our own non-blocking
# ring buffer into the CDC ACM UART (src/main.c), never uart_poll_out()
# (which can sleep in a loop when the CDC buffer is full).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n

# ---- USB CDC ACM status console (device_next stack, as Tape Looper) ----
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# The app owns the USBD context (sample_usbd_init_device), exactly like
# Tape Looper; no second private context built by the CDC SYS_INIT.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UDC_ENABLE_SOF=n
# Serial-number string descriptor from FICR (read-only).
CONFIG_HWINFO=y
# VID is fixed by Zephyr v4.3.1's sample helper to 0x2fe3 (Zephyr Project,
# development use). PID 0x0001 is the sample default.
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_MANUFACTURER="sp1-fx"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 FX tone test"
# Battery powered; claim 100 mA like Tape Looper.
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_SP1FX_USB_CONSOLE=y

# USB init (descriptor build + class registration) wants a roomier stack.
CONFIG_MAIN_STACK_SIZE=2048
# main (watchdog, LEDs, I2C, console) runs below the audio thread (prio 0).
CONFIG_MAIN_THREAD_PRIORITY=7

# Same LFCLK source as the board defconfig and Tape Looper's prj.conf.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# Deterministic output.
CONFIG_BUILD_OUTPUT_STRIP_PATHS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
