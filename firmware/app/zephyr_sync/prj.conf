# SP-1 FX sync-jack bring-up image: watchdog + LEDs + FN (as zephyr_min) plus
# MIDI clock / PO sync on the SYNC jack and a USB CDC ACM status console.
# See docs/BRINGUP_SYNC.md. NOT TESTED ON HARDWARE.

CONFIG_GPIO=y
CONFIG_WATCHDOG=y

# No printk/console: status goes through a non-blocking ring buffer into the
# CDC ACM UART (same pattern as zephyr_tone).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n

# ---- USB CDC ACM status console (device_next stack, as Tape Looper) ----
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UDC_ENABLE_SOF=n
CONFIG_HWINFO=y
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_MANUFACTURER="sp1-fx"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 FX sync test"
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_SP1FX_USB_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

# Sync jack defaults (UNVERIFIED wiring/polarity; see docs/BRINGUP_SYNC.md)
CONFIG_SP1FX_SYNC_BPM=120
CONFIG_SP1FX_SYNC_MIDI_INVERT=y
CONFIG_SP1FX_SYNC_SWAP_TIP_RING=n
CONFIG_SP1FX_SYNC_PO_ACTIVE_LOW=n
CONFIG_SP1FX_SYNC_PO_PULSE_MS=5

# Same LFCLK source as the board defconfig and Tape Looper's prj.conf.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# Deterministic output.
CONFIG_BUILD_OUTPUT_STRIP_PATHS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
