# Optional overlay: build the sync image WITHOUT USB (no status console).
# Use if USB bring-up disturbs the watchdog/LEDs/timing:
#   firmware/scripts/build_sync.sh --no-usb
CONFIG_SP1FX_USB_CONSOLE=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_HWINFO=n
CONFIG_UART_LINE_CTRL=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SERIAL=n
