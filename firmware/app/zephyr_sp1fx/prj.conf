# SP-1 FX integrated firmware (zephyr_sp1fx). See docs/BRINGUP_SP1FX.md.
# Base: zephyr_usbaudio image A (hardware-verified audio path) + zephyr_controls (SAADC,
# PWM LEDs) + flash for the settings journal + thread runtime statistics for the diag line.

CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_ADC=y
CONFIG_FLASH=y
CONFIG_FPU=y
# The DSP is the point of this image: -O2 instead of -Os (flash is plentiful).
CONFIG_SPEED_OPTIMIZATIONS=y

# I2S TX queue depth as the usbaudio image: 4 x 64-frame blocks (5.3 ms) + 2 in DMA.
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=4

# No printk/console/logging: diagnostic text goes through our own non-blocking ring.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n

# ---- USB: composite UAC2 (speaker, explicit feedback) + CDC ACM (device_next) ----
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_HWINFO=y
# VID 0x2fe3 (Zephyr Project, development use only) from the sample helper.
# Own PID so hosts do not reuse descriptors cached for the bring-up images.
CONFIG_SAMPLE_USBD_PID=0x0110
CONFIG_SAMPLE_USBD_MANUFACTURER="sp1-fx"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 FX"
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_SP1FX_USB_CONSOLE=y

# main = control thread (controls, protocol, storage); the settings journal keeps a 512 B
# record + payload on the stack.
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_MAIN_THREAD_PRIORITY=7

# Crash diagnostics as the usbaudio image (drivers/crashdump.c).
CONFIG_HW_STACK_PROTECTION=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# Per-thread CPU time for the diag line (audio / main / sync / other / idle).
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

CONFIG_BUILD_OUTPUT_STRIP_PATHS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
