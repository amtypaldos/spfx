# SP-1 FX controls bring-up image: watchdog + FN-hold power-off (as
# zephyr_min) plus SAADC ladders/faders, the real SP-1 FX controller, PWM LEDs
# and a USB CDC ACM status console. No audio. See docs/BRINGUP_CONTROLS.md.

CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_ADC=y
CONFIG_FPU=y

# No printk/console: lines go through our own non-blocking ring buffer into
# the CDC ACM UART (src/main.c), never uart_poll_out().
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n

# ---- USB CDC ACM status console (device_next stack, as Tape Looper) ----
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UDC_ENABLE_SOF=n
CONFIG_HWINFO=y
# VID 0x2fe3 (Zephyr Project, development use) fixed by the v4.3.1 sample
# helper; PID 0x0002 so the host does not confuse it with the tone image.
CONFIG_SAMPLE_USBD_PID=0x0002
CONFIG_SAMPLE_USBD_MANUFACTURER="sp1-fx"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 FX controls test"
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_SP1FX_USB_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=7

# Same LFCLK source as the board defconfig and Tape Looper's prj.conf.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# Deterministic output.
CONFIG_BUILD_OUTPUT_STRIP_PATHS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
