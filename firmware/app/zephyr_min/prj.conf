# SP-1 FX minimal image: watchdog feed + one heartbeat LED + FN-hold -> SYSTEM_OFF.
# No USB, audio, I2S, I2C, ADC, storage or logging (see app.overlay).

CONFIG_GPIO=y
CONFIG_WATCHDOG=y

# No console / serial: the board's chosen console is the USB CDC ACM port,
# and USB is deliberately not enabled in this image.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n

# Same LFCLK source as the board defconfig and Tape Looper's prj.conf
# (bootloader-compatible; no 32.768 kHz crystal is driven for the app).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# Deterministic output: strip absolute source paths from __FILE__ etc.
CONFIG_BUILD_OUTPUT_STRIP_PATHS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
