# SP-1 FX USB audio bring-up, image A (and the base of image B, which adds
# ../zephyr_usbaudio_io/prj_io.conf). See docs/BRINGUP_USBAUDIO.md.

CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_FPU=y
# The DSP is the point of this image: -O2 instead of -Os (flash is plentiful).
CONFIG_SPEED_OPTIMIZATIONS=y

# I2S TX queue depth as the tone image: 4 x 64-frame blocks (5.3 ms) + 2 in DMA.
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=4

# No printk/console/logging (same as the tone image).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n

# ---- USB: composite UAC2 + CDC ACM (device_next) ----
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_AUDIO2_CLASS=y
# (USBD_AUDIO2_CLASS selects UDC_ENABLE_SOF: the feedback runs once per SOF.)
CONFIG_HWINFO=y
# VID 0x2fe3 (Zephyr Project, development use only) from the sample helper.
# PIDs differ per image so hosts do not reuse cached descriptors.
CONFIG_SAMPLE_USBD_PID=0x0101
CONFIG_SAMPLE_USBD_MANUFACTURER="sp1-fx"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 FX"
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_SP1FX_USB_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=7

CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

CONFIG_BUILD_OUTPUT_STRIP_PATHS=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
